name: TV Theater CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Unit Tests & APK Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests (100% Pass Enforced)
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint Audit
        run: ./gradlew lintDebug

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload APK Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-theater-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  docker-verification:
    name: Verify Multi-Stage Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: exporter
          push: false
          tags: tv-theater:ci-test
