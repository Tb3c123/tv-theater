name: Build Release APK (Không Debug)

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Ghi chú cho bản build (tuỳ chọn)'
        required: false
        default: 'Manual Release Build'
        type: string
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Export Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Run Release Unit Tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Assemble Release APK (Không Debug)
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature & Output
        run: |
          echo "Kiểm tra file APK release đã được tạo:"
          ls -lh app/build/outputs/apk/release/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-theater-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release (Khi có Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
